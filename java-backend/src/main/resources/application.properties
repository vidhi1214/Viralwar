# ========== SERVER ==========
server.port=8080
server.servlet.context-path=/api

# ========== DATABASE ==========
spring.datasource.url=jdbc:postgresql://localhost:5432/viralwar
spring.datasource.username=vidhijain
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ========== JWT ==========
jwt.secret=viralwar-jwt-secret-change-in-production-must-be-at-least-32-chars
jwt.expiration-ms=604800000
jwt.refresh-expiration-ms=2592000000

# ========== CORS ==========
cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ========== SOCIAL MEDIA APIs ==========
# YouTube Data API v3
youtube.api.key=YOUR_YOUTUBE_API_KEY
youtube.api.base-url=https://www.googleapis.com/youtube/v3

# Instagram Graph API
instagram.api.base-url=https://graph.instagram.com
instagram.api.version=v20.0

# ========== CACHE (Caffeine) ==========
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=300s

# ========== ACTUATOR ==========
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========== LOGGING ==========
logging.level.com.viralwar=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO

# ========== OPENAPI ==========
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# ========== JACKSON ==========
spring.jackson.serialization.fail-on-empty-beans=false

